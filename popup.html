<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Profile Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .section {
        margin-bottom: 14px;
      }
      .section-label {
        font-size: 11px;
        opacity: 0.55;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      .file-name {
        font-size: 13px;
        font-weight: 600;
        word-break: break-all;
        min-height: 18px;
        margin-bottom: 8px;
      }
      .file-name.empty {
        font-weight: 400;
        opacity: 0.65;
      }
      button {
        appearance: none;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
        color: CanvasText;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
        width: 100%;
      }
      button.primary {
        background: #0a66c2;
        color: white;
        border-color: #0a66c2;
      }
      button.subtle {
        background: transparent;
      }
      button:hover {
        filter: brightness(1.05);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .row > button {
        flex: 1;
      }
      .stats {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 8px;
      }
      .status {
        font-size: 12px;
        padding: 8px 10px;
        background: color-mix(in srgb, Canvas 88%, CanvasText 12%);
        border-radius: 6px;
        min-height: 28px;
        word-break: break-word;
      }
      .status.warn {
        background: color-mix(in srgb, #ffb300 35%, Canvas);
      }
      .footer {
        margin-top: 12px;
        font-size: 11px;
        opacity: 0.55;
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
      hr {
        border: none;
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <h1>LinkedIn Profile Tracker</h1>

    <div class="section">
      <div class="stats">
        Profiles saved: <strong id="count">0</strong>
      </div>
      <button id="download" class="primary">Download CSV</button>
    </div>

    <div id="file-section" class="section hidden">
      <hr />
      <div class="section-label">Auto-append to a file (Chrome only)</div>
      <div id="file-name" class="file-name empty">No CSV file selected</div>
      <button id="pick-file">Choose CSV file…</button>
      <div class="row">
        <button id="resume" class="subtle">Resume tracking</button>
      </div>
    </div>

    <hr />

    <div id="status" class="status">Loading…</div>

    <div class="row">
      <button id="clear" class="subtle">Clear saved data</button>
    </div>

    <div class="footer">v0.2.0 · local CSV · no servers</div>

    <script src="popup.js"></script>
  </body>
</html>
