<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Profile Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .file-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .file-name {
        font-size: 13px;
        font-weight: 600;
        word-break: break-all;
        min-height: 18px;
      }
      .file-name.empty {
        font-weight: 400;
        opacity: 0.65;
      }
      button {
        appearance: none;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
        color: CanvasText;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
      }
      button.primary {
        background: #0a66c2;
        color: white;
        border-color: #0a66c2;
      }
      button.subtle {
        background: transparent;
      }
      button:hover {
        filter: brightness(1.05);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .row > button {
        flex: 1;
      }
      .stats {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 8px;
      }
      .status {
        font-size: 12px;
        padding: 8px 10px;
        background: color-mix(in srgb, Canvas 88%, CanvasText 12%);
        border-radius: 6px;
        min-height: 28px;
        word-break: break-word;
      }
      .status.warn {
        background: color-mix(in srgb, #ffb300 35%, Canvas);
      }
      .footer {
        margin-top: 12px;
        font-size: 11px;
        opacity: 0.55;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>LinkedIn Profile Tracker</h1>

    <div class="file-row">
      <div id="file-name" class="file-name empty">No CSV file selected</div>
      <button id="pick-file" class="primary">Choose CSV file…</button>
    </div>

    <div class="row">
      <button id="resume" class="subtle">Resume tracking</button>
      <button id="clear" class="subtle">Clear history</button>
    </div>

    <div class="stats">
      Profiles saved this session: <span id="count">0</span>
    </div>

    <div id="status" class="status">Loading…</div>

    <div class="footer">v0.1.0 · local CSV · no servers</div>

    <script src="popup.js"></script>
  </body>
</html>
